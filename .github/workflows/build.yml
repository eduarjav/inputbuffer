name: Build Geode Mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pin compatible Geode Bindings
        shell: bash
        run: |
          git clone https://github.com/geode-sdk/bindings.git D:/geode-bindings
          cd D:/geode-bindings
          git checkout "$(git rev-list -n 1 --before='2026-10-18 17:30:00 UTC' main)"
          echo "GEODE_BINDINGS_REPO_PATH=D:/geode-bindings" >> $GITHUB_ENV

      - name: Build Geode Mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: v5.11.2
          cli: latest

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: InputBuffer-Mod
          path: ${{ steps.build.outputs.build-output }}
